name: Build and check the learning skill

on:
  workflow_dispatch:
  push:
    tags: ['fieldnotes-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/activity.js
      - run: node --check web/bridge.js
      - run: python3 install.py --package learning-guide.zip
      - run: sha256sum learning-guide.zip > learning-guide.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: learning-guide
          path: |
            learning-guide.zip
            learning-guide.zip.sha256
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/fieldnotes-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" learning-guide.zip learning-guide.zip.sha256 --generate-notes
